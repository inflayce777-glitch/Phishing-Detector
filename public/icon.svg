<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#04070a" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded cyber tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-opacity="0.35" />

  <!-- Outer Cyber Shield Glow -->
  <path
    d="M256 70 L400 120 C400 256 342 364 256 438 C170 364 112 256 112 120 Z"
    fill="none"
    stroke="url(#shieldGrad)"
    stroke-width="14"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Inner Shield Fill -->
  <path
    d="M256 98 L374 138 C374 246 324 338 256 404 C188 338 138 246 138 138 Z"
    fill="#061a24"
    fill-opacity="0.85"
    stroke="url(#shieldGrad)"
    stroke-width="5"
    stroke-opacity="0.6"
    stroke-linejoin="round"
  />

  <!-- Cyber Lock Shackle -->
  <path
    d="M218 226 V192 C218 171 235 154 256 154 C277 154 294 171 294 192 V226"
    fill="none"
    stroke="url(#coreGrad)"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Cyber Lock Body -->
  <rect
    x="196"
    y="222"
    width="120"
    height="104"
    rx="20"
    fill="#0c2b3a"
    stroke="url(#shieldGrad)"
    stroke-width="10"
  />

  <!-- Keyhole / Pulse Core -->
  <circle cx="256" cy="264" r="14" fill="#00ff88" filter="url(#neonGlow)" />
  <path
    d="M250 270 L244 300 H268 L262 270 Z"
    fill="#00ff88"
  />

  <!-- Circuit nodes & Cyber accents -->
  <line x1="256" y1="328" x2="256" y2="368" stroke="url(#coreGrad)" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="374" r="6" fill="#00f0ff" />
  
  <line x1="168" y1="206" x2="196" y2="242" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" />
  <circle cx="162" cy="198" r="5" fill="#00f0ff" />
  
  <line x1="344" y1="206" x2="316" y2="242" stroke="#00ff88" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" />
  <circle cx="350" cy="198" r="5" fill="#00ff88" />
</svg>
